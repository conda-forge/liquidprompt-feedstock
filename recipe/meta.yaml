{% set name = "liquidprompt" %}
{% set version = "2.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # The release asset, not the git archive: upstream only ships the generated
  # example config (liquidpromptrc-dist) in the release tarball.
  url: https://github.com/{{ name }}/{{ name }}/releases/download/v{{ version }}/{{ name }}-v{{ version }}.tar.gz
  sha256: ff274d36f47f4fb6a34c6eb1eae2d58e51944a863b74031ff29c6c03ab011ec3

build:
  number: 1
  # The c stdlib is only in the build requirements to satisfy the osx CI
  # build scripts; its run_exports would otherwise pin __osx >=11.0 on a
  # package of shell scripts that runs on any macOS.
  ignore_run_exports:
    - __osx  # [osx]

requirements:
  build:
    # Required by the osx CI build scripts whenever the config sets
    # MACOSX_DEPLOYMENT_TARGET, even though nothing here is compiled.
    - {{ stdlib('c') }}  # [osx]
    - sed  # [osx]
    - m2-base  # [win]
  run:
    - m2-base  # [win]

test:
  commands:
    - test -f $PREFIX/etc/liquidprompt/themes/unfold/unfold.theme  # [not win]
    - test -f $PREFIX/etc/liquidprompt/themes/powerline/powerline.theme  # [not win]
    - test -f $PREFIX/etc/liquidprompt/themes/alternate_vcs/alternate_vcs.theme  # [not win]
    - if not exist %PREFIX%\Library\etc\liquidprompt\themes\unfold\unfold.theme exit 1  # [win]
    - grep -q '${CONDA_PREFIX}' $PREFIX/etc/conda/activate.d/liquidprompt.sh  # [not win]
    - grep -q '${CONDA_PREFIX}' %PREFIX%\etc\conda\activate.d\liquidprompt.sh  # [win]
    - grep -q 'lp_theme unfold' $PREFIX/etc/conda/activate.d/liquidprompt.sh  # [not win]
    - grep -q 'themes/\*/\*.theme' $PREFIX/etc/conda/activate.d/liquidprompt.sh  # [not win]
    - grep -q 'lp_theme unfold' %PREFIX%\etc\conda\activate.d\liquidprompt.sh  # [win]
    - '! grep -q export $PREFIX/etc/conda/activate.d/liquidprompt.sh'  # [not win]

about:
  home: https://github.com/nojhan/liquidprompt
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: A full-featured & carefully designed adaptive prompt for Bash & Zsh

  description: |
    Liquid Prompt gives you a nicely displayed prompt with useful 
    information when you need it. It shows you what you need when you need
    it. You will notice what changes when it changes, saving time and 
    frustration. You can even use it with your favorite shell – Bash or zsh.
  doc_url: https://github.com/nojhan/liquidprompt/blob/master/README.md
  dev_url: https://github.com/nojhan/liquidprompt

extra:
  recipe-maintainers:
    - sodre
