{% set name = "liquidprompt" %}
{% set version = "2.1.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://github.com/{{ name }}/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: f752f46595519befd1ad83eaa3605cfc05babd485250a0b46916d8eacabf4f26

build:
  number: 1
  # The c stdlib is only in the build requirements to satisfy the osx CI
  # build scripts; its run_exports would otherwise pin __osx >=11.0 on a
  # package of shell scripts that runs on any macOS.
  ignore_run_exports:
    - __osx  # [osx]

requirements:
  build:
    # Required by the osx CI build scripts whenever the config sets
    # MACOSX_DEPLOYMENT_TARGET, even though nothing here is compiled.
    - {{ stdlib('c') }}  # [osx]
    - sed  # [osx]
    - m2-base  # [win]
  run:
    - m2-base  # [win]

test:
  commands:
    - grep -q '${CONDA_PREFIX}' $PREFIX/etc/conda/activate.d/liquidprompt.sh  # [not win]
    - grep -q '${CONDA_PREFIX}' %PREFIX%\etc\conda\activate.d\liquidprompt.sh  # [win]
    - grep -q 'LP_MARK_PREFIX' $PREFIX/etc/conda/activate.d/liquidprompt.sh  # [not win]
    - grep -q 'LP_MARK_PREFIX' %PREFIX%\etc\conda\activate.d\liquidprompt.sh  # [win]
    - grep -q 'LP_MARK_PREFIX' $PREFIX/etc/conda/deactivate.d/liquidprompt.sh  # [not win]
    - grep -q 'LP_MARK_PREFIX' %PREFIX%\etc\conda\deactivate.d\liquidprompt.sh  # [win]
    - '! grep -q export $PREFIX/etc/conda/activate.d/liquidprompt.sh'  # [not win]

about:
  home: https://github.com/nojhan/liquidprompt
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: A full-featured & carefully designed adaptive prompt for Bash & Zsh

  description: |
    Liquid Prompt gives you a nicely displayed prompt with useful 
    information when you need it. It shows you what you need when you need
    it. You will notice what changes when it changes, saving time and 
    frustration. You can even use it with your favorite shell – Bash or zsh.
  doc_url: https://github.com/nojhan/liquidprompt/blob/master/README.md
  dev_url: https://github.com/nojhan/liquidprompt

extra:
  recipe-maintainers:
    - sodre
